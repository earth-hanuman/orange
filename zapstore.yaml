# Zapstore publishing manifest for Orange.
# Format reference: run `zsp skill`. Verify with `zsp check` before publishing.
#
# Publishing (you run these — secrets stay with you):
#   export SIGN_WITH=nsec1...        # or a bunker:// remote signer
#   zsp check                         # validates listing + APK, shows next_step
#   zsp publish -q
#
# Published from the GitHub repo: attach the SIGNED app-release.apk to a GitHub
# Release (see README), then `zsp` pulls that asset — no local path committed.
repository: https://github.com/earth-hanuman/orange

# For a LOCAL test run before a release asset exists, pass the APK on the CLI
# instead of committing a path here:
#   zsp check  app/build/outputs/apk/release/app-release.apk
#   zsp publish -s app/build/outputs/apk/release/app-release.apk

name: Orange
summary: System-level warm color filter and grayscale, no root
description: |
  Orange is a privacy-first blue-light / color filter that drives the display
  directly on GrapheneOS — no root required.

  - Warmth: a deep amber/red tint with adjustable hue and intensity, able to go
    warmer and more saturated than the stock Night Light.
  - Grayscale: true desaturation via the system daltonizer.
  - Extra Dim: the real reduce-bright-colors transform.
  - Time schedule (re-armed after reboot) and a Quick Settings tile.

  No network access: Orange has no INTERNET permission, no analytics, and no
  third-party SDKs. Grayscale and dim are granted once via WRITE_SECURE_SETTINGS
  (adb); warmth uses a screen overlay.

license: GPL-3.0
tags: [utilities, accessibility, privacy]

